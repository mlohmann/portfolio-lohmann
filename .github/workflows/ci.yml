name: Validate repository

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      STORYBOOK_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked JavaScript dependencies
        run: npm ci
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Install isolated image tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/portfolio-image-tools"
          "$RUNNER_TEMP/portfolio-image-tools/bin/python" -m pip install -r scripts/requirements.txt
          echo "IMAGE_PYTHON=$RUNNER_TEMP/portfolio-image-tools/bin/python" >> "$GITHUB_ENV"
      - name: Type check
        run: npm run typecheck
      - name: Unit, maintenance, and production browser tests
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:all
      - name: Build Storybook
        run: npm run build-storybook
